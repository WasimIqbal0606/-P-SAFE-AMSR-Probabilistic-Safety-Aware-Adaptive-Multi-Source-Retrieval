<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860">
  <rect width="1800" height="860" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1D2733; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #5F6B76; }
