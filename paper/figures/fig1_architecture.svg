  <text x="70" y="64" class="title" text-anchor="start" >B-P-SAFE-AMSR Binary Retrieval Routing</text><text x="70" y="98" class="subtitle" text-anchor="start" >A calibrated routing layer over existing Dense and Deep Hybrid endpoints</text><rect x="70" y="315" width="170" height="105" rx="12" fill="#FFFFFF" stroke="#276FBF" stroke-width="3"/><text x="155" y="348" class="label" text-anchor="middle" font-weight="700">Query</text><text x="155" y="377" class="small" text-anchor="middle" >held-out input</text><rect x="330" y="205" width="270" height="105" rx="12" fill="#FFFFFF" stroke="#276FBF" stroke-width="3"/><text x="465" y="238" class="label" text-anchor="middle" font-weight="700">Dense retrieval</text><text x="465" y="267" class="small" text-anchor="middle" >FAISS IndexFlatIP</text><text x="465" y="291" class="small" text-anchor="middle" >top-50 scores</text><rect x="330" y="350" width="270" height="105" rx="12" fill="#FFFFFF" stroke="#D17A22" stroke-width="3"/><text x="465" y="383" class="label" text-anchor="middle" font-weight="700">Lexical retrieval</text><text x="465" y="412" class="small" text-anchor="middle" >BM25 top-100</text><text x="465" y="436" class="small" text-anchor="middle" >score distribution</text><rect x="330" y="495" width="270" height="105" rx="12" fill="#FFFFFF" stroke="#647A3D" stroke-width="3"/><text x="465" y="528" class="label" text-anchor="middle" font-weight="700">Semantic neighbours</text><text x="465" y="557" class="small" text-anchor="middle" >cached top-k lists</text><text x="465" y="581" class="small" text-anchor="middle" >degree features</text><rect x="710" y="315" width="270" height="125" rx="12" fill="#FFFFFF" stroke="#276FBF" stroke-width="3"/><text x="845" y="348" class="label" text-anchor="middle" font-weight="700">Feature vector</text><text x="845" y="377" class="small" text-anchor="middle" >25 query/retrieval signals</text><text x="845" y="401" class="small" text-anchor="middle" >train-only standardization</text><rect x="1085" y="205" width="300" height="180" rx="12" fill="#FFFFFF" stroke="#B85C7A" stroke-width="3"/><text x="1235" y="238" class="label" text-anchor="middle" font-weight="700">Predictive models</text><text x="1235" y="267" class="small" text-anchor="middle" >P(gain), P(regression)</text><text x="1235" y="291" class="small" text-anchor="middle" >expected ΔnDCG@10</text><text x="1235" y="315" class="small" text-anchor="middle" >expected latency</text><text x="1235" y="339" class="small" text-anchor="middle" >sigmoid calibration objective</text><rect x="1085" y="465" width="300" height="145" rx="12" fill="#FFFFFF" stroke="#D17A22" stroke-width="3"/><text x="1235" y="498" class="label" text-anchor="middle" font-weight="700">Utility and mode gate</text><text x="1235" y="527" class="small" text-anchor="middle" >U(A6 | x) versus Dense=0</text><text x="1235" y="551" class="small" text-anchor="middle" >thresholds + logged override</text><text x="1235" y="575" class="small" text-anchor="middle" >validation-selected settings</text><rect x="1505" y="225" width="230" height="105" rx="12" fill="#FFFFFF" stroke="#276FBF" stroke-width="3"/><text x="1620" y="258" class="label" text-anchor="middle" font-weight="700">A0: Dense</text><text x="1620" y="287" class="small" text-anchor="middle" >return Dense ranking</text><rect x="1505" y="500" width="230" height="135" rx="12" fill="#FFFFFF" stroke="#D17A22" stroke-width="3"/><text x="1620" y="533" class="label" text-anchor="middle" font-weight="700">A6: Deep Hybrid</text><text x="1620" y="562" class="small" text-anchor="middle" >Dense + BM25 + graph</text><text x="1620" y="586" class="small" text-anchor="middle" >fusion + Cross-Encoder</text><line x1="240" y1="367" x2="330" y2="257" stroke="#5F6B76" stroke-width="3"/><polygon points="330,257 328.68051380213853,267.92057490124273 319.55695850231876,260.4558478377539" fill="#5F6B76"/><line x1="240" y1="367" x2="330" y2="402" stroke="#5F6B76" stroke-width="3"/><polygon points="330,402 319.2076141171783,404.12706533897557 323.4801993234474,393.1404176657122" fill="#5F6B76"/><line x1="240" y1="367" x2="330" y2="547" stroke="#5F6B76" stroke-width="3"/><polygon points="330,547 320.57461719315637,541.3288309014405 331.11829440525855,536.0569922953894" fill="#5F6B76"/><line x1="600" y1="257" x2="710" y2="352" stroke="#5F6B76" stroke-width="3"/><polygon points="710,352 699.1184277557753,350.3902219116541 706.8234226415423,341.4686488860292" fill="#5F6B76"/><line x1="600" y1="402" x2="710" y2="377" stroke="#5F6B76" stroke-width="3"/><polygon points="710,377 702.2496048685817,384.80585519382015 699.6370933045945,373.31080431227616" fill="#5F6B76"/><line x1="600" y1="547" x2="710" y2="405" stroke="#5F6B76" stroke-width="3"/><polygon points="710,405 708.9718658289605,415.95184642543626 699.6527148408329,408.7327858008304" fill="#5F6B76"/><line x1="980" y1="360" x2="1085" y2="295" stroke="#5F6B76" stroke-width="3"/><polygon points="1085,295 1080.205455286169,304.90011823096444 1074.0006873503794,294.87703156545814" fill="#5F6B76"/><line x1="1235" y1="385" x2="1235" y2="465" stroke="#5F6B76" stroke-width="3"/><polygon points="1235,465 1229.105905255231,455.7123928194778 1240.894094744769,455.7123928194778" fill="#5F6B76"/><line x1="1385" y1="525" x2="1505" y2="277" stroke="#276FBF" stroke-width="3"/><polygon points="1505,277 1506.2603051098072,287.92756290442634 1495.6490572833604,282.79308814969403" fill="#276FBF"/><line x1="1385" y1="550" x2="1505" y2="567" stroke="#D17A22" stroke-width="3"/><polygon points="1505,567 1494.97746975931,571.5330880836858 1496.6309534450993,559.8614385369387" fill="#D17A22"/><text x="1435" y="365" class="small" text-anchor="middle" >fallback</text><text x="1440" y="545" class="small" text-anchor="middle" >escalate</text><rect x="70" y="708" width="1665" height="86" rx="10" fill="#F6F8FA" stroke="#D7DDE3" stroke-width="1"/><text x="100" y="742" class="value" text-anchor="start" >Scope:</text><text x="180" y="742" class="small" text-anchor="start" >binary Dense-versus-Deep-Hybrid routing; retrieval-quality regression risk, not content-safety risk.</text><text x="100" y="773" class="value" text-anchor="start" >Graph construction:</text><text x="275" y="773" class="small" text-anchor="start" >FAISS flat inner-product top-k neighbour lists cached as an expansion graph; no HNSW index.</text>
</svg>